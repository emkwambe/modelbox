name: Verify Release

# The black-box acceptance suite against the images a release published,
# pulled on a runner that never built them. Runs after every successful
# "Release Images" run, or on demand for a version already published.
#
# The suite and its test-only overrides come from this workflow's checkout;
# the appliance compose file must be identical to the release tag's, which is
# checked before anything runs, so the images are exercised exactly as the
# release describes them.
on:
  workflow_run:
    workflows: ["Release Images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to verify, without the v (e.g. 1.11.0)"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Black-box suite against the published images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: modelbox-ai
    env:
      BLACKBOX_EXTRA_COMPOSE: tests/blackbox/compose/published.yml
      COMPOSE: docker compose --env-file .env -f docker/docker-compose.appliance.yml -f tests/blackbox/compose/published.yml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASED_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT_VERSION:-${RELEASED_REF#v}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::no published version to verify: '$version'"
            exit 1
          fi
          echo "MODELBOX_RELEASE=$version" >> "$GITHUB_ENV"
          echo "verifying v$version"

      - name: The compose file is the release's
        run: git diff --exit-code "v${MODELBOX_RELEASE}" -- docker/docker-compose.appliance.yml

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the suite's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/blackbox/requirements.txt

      - name: "A: only .env.example, compose refuses"
        run: python -m pytest tests/blackbox -m config_a -v --no-header -rA

      - name: Create .env with init-env
        run: sh scripts/init-env.sh

      - name: Pull the published images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          $COMPOSE pull modelbox-ui modelbox-backend modelbox-worker modelbox-migrate
          for image in modelbox-frontend modelbox-backend; do
            docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/emkwambe/${image}:${MODELBOX_RELEASE}"
          done

      - name: "B: the hardened appliance, every check passes"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: hardened
        run: |
          $COMPOSE up -d --no-build
          python -m pytest tests/blackbox -m config_b -v --no-header -rA

      - name: Stop B
        if: ${{ !cancelled() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

      - name: "Upgrade: designate-appliance-owner on an upgraded database"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: hardened
        run: python -m pytest tests/blackbox -m upgrade -v --no-header -rA

      - name: Stop the upgraded appliance
        if: ${{ !cancelled() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

      - name: "Insecure profile: each check covering a reintroduced weakness fails"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: insecure
        run: |
          $COMPOSE -f tests/blackbox/compose/insecure.yml --profile airgap up -d --no-build
          python -m pytest tests/blackbox -m config_b -v --no-header -rA

      - name: Stop the insecure profile
        if: ${{ !cancelled() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

      - name: "C: AIRGAPPED, sentinel keys, egress-deny network"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: egress-deny
        run: |
          sed -i 's/^AIRGAPPED=.*/AIRGAPPED=true/' .env
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY MISTRAL_API_KEY DEEPSEEK_API_KEY MOONSHOT_API_KEY; do
            sed -i "s/^${key}=.*/${key}=sentinel-${key}-must-never-leave/" .env
          done
          $COMPOSE -f tests/blackbox/compose/egress-deny.yml up -d --no-build
          python -m pytest tests/blackbox -m config_c -v --no-header -rA

      - name: Appliance logs
        if: ${{ failure() }}
        run: |
          docker compose -p modelbox-ai ps -a
          docker compose -p modelbox-ai logs --no-color --tail 200

      - name: Stop C
        if: ${{ always() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans
