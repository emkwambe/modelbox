name: ModelBox AI CI

# Gates every push and pull request. Before v1.6.0 this ran on `main` and PRs
# into `main` only, so feature branches were unguarded until a PR was opened.
on:
  push:
    branches: [ "**" ]
  pull_request:

# Keyed by commit, not branch. Keyed by branch, re-running an older commit's
# run cancelled the branch head's run, which then had to be re-run by hand.
# Cancellation now applies only to another run of the same commit.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  backend-test:
    # Type checking is its own job (Backend Type Check (mypy)) since Sprint 7.
    name: Backend Pytest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: modelbox-ai/backend/requirements.lock

      - name: Install Backend Dependencies
        # The lock, not requirements.txt: every dependency is floor-only (>=),
        # so an unpinned install resolves to whatever PyPI serves that day.
        run: |
          python -m pip install --upgrade pip
          pip install -r modelbox-ai/backend/requirements.lock

      - name: Run Pytest Suite
        run: |
          cd modelbox-ai/backend
          pytest -v

  backend-test-postgres:
    # The whole backend suite again, with every test database on the
    # PostgreSQL the appliance ships (tests/_test_db.py). A difference from the
    # SQLite run is a finding to diagnose, never a test to skip.
    # test_test_database.py fails if the engines are not PostgreSQL.
    name: Backend Pytest (Postgres)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: modelbox-ai/backend/requirements.lock

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r modelbox-ai/backend/requirements.lock

      - name: Start the appliance's PostgreSQL
        # The image is read from the appliance compose file, so this job
        # cannot drift from the pinned version and digest. Docker chooses the
        # host port and reports it, rather than the job racing to guess one.
        run: |
          image="$(python -c 'import yaml; print(yaml.safe_load(open("modelbox-ai/docker/docker-compose.appliance.yml"))["services"]["postgres-db"]["image"])')"
          echo "image: $image"
          docker run -d --name modelbox-test-postgres \
            -e POSTGRES_USER=mbtest -e POSTGRES_PASSWORD=mbtest -e POSTGRES_DB=mbtest \
            -p 127.0.0.1::5432 "$image"
          # `docker port` can be briefly empty straight after `docker run -d`.
          port=""
          for _ in $(seq 1 30); do
            port="$(docker port modelbox-test-postgres 5432 | head -n 1 | awk -F: '{print $NF}')"
            [ -n "$port" ] && break
            sleep 1
          done
          if [ -z "$port" ]; then
            echo "::error::docker published no host port for the test database"
            exit 1
          fi
          echo "MODELBOX_TEST_DATABASE_URL=postgresql+asyncpg://mbtest:mbtest@127.0.0.1:${port}/mbtest" >> "$GITHUB_ENV"
          echo "MODELBOX_TEST_DATABASE_EXPECT=postgresql" >> "$GITHUB_ENV"
          echo "PGPORT_FOR_READINESS=${port}" >> "$GITHUB_ENV"

      - name: Wait until a query completes over the host port
        # The image initialises on a temporary server without TCP, then
        # restarts; a completed query over the host port is the readiness the
        # tests need (the same rule as tests/_docker_postgres.py).
        run: |
          python - <<'PY'
          import os, sys, time
          import psycopg2
          port = int(os.environ["PGPORT_FOR_READINESS"])
          last = None
          for _ in range(60):
              try:
                  conn = psycopg2.connect(host="127.0.0.1", port=port, user="mbtest",
                                          password="mbtest", dbname="mbtest", connect_timeout=3)
                  with conn.cursor() as cur:
                      cur.execute("SELECT version()")
                      print(cur.fetchone()[0])
                  conn.close()
                  sys.exit(0)
              except psycopg2.OperationalError as exc:
                  last = exc
                  time.sleep(1)
          print(f"::error::postgres never answered a query on 127.0.0.1:{port}: {last}")
          sys.exit(1)
          PY

      - name: Run Pytest Suite on PostgreSQL
        run: |
          cd modelbox-ai/backend
          pytest -v

  artifact-fidelity:
    name: Artifact Fidelity Harness
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: modelbox-ai/backend/requirements-dev.txt

      - name: Set up Node.js 22
        # Cube.js schemas are executed rather than regex-matched, and the gold
        # graph mirror is re-extracted from templates.ts to prove it has not
        # drifted. That extraction imports a TypeScript module directly, which
        # requires --experimental-strip-types: Node >= 22.6. The frontend jobs
        # stay on 20, matching the app's own engines constraint.
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Install Verification Toolchain
        # A SEPARATE environment from the app dependencies. Installing dbt
        # alongside them downgrades protobuf and pathspec and removes mypy.
        run: |
          python -m pip install --upgrade pip
          pip install -r modelbox-ai/backend/requirements-dev.txt

      - name: Populate the offline dbt package cache
        # `dbt build` needs the project's packages installed, and `dbt deps`
        # fetches them. Doing that here rather than inside a test keeps the
        # harness itself offline: a gate that can fail because a package
        # registry is slow is not a gate.
        #
        # The script also FAILS on any deprecation dbt reports while resolving
        # the exporter's own packages.yml. Those fire against the registry, so
        # this step is the only place they are observable at all (M15) — and
        # the diff check makes a resolution that no longer matches the
        # committed lock a red build rather than a silent drift.
        run: |
          cd modelbox-ai/backend
          python scripts/refresh_dbt_packages.py
          git diff --exit-code tests/fixtures/dbt/package-lock.yml

      - name: Run Fidelity Harness
        # MODELBOX_FIDELITY_STRICT turns a missing toolchain into a hard failure.
        # Without it a failed install would make every gate skip and this job
        # would report green having verified nothing.
        env:
          MODELBOX_FIDELITY_STRICT: "1"
        run: |
          cd modelbox-ai/backend
          pytest tests/test_artifact_fidelity.py -v --no-header

      - name: Report xfail burn-down
        if: always()
        env:
          MODELBOX_FIDELITY_STRICT: "1"
        run: |
          cd modelbox-ai/backend
          echo "### Artifact fidelity" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "burn-down (non-preview, target 0):" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/test_artifact_fidelity.py -m "not preview" -q --no-header \
            2>/dev/null | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo "preview (labelled, not debt):" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/test_artifact_fidelity.py -m preview -q --no-header \
            2>/dev/null | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  frontend-build:
    name: Frontend Strict Type Check & Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: modelbox-ai/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd modelbox-ai/frontend
          npm ci

      - name: Run TypeScript Strict Check
        run: |
          cd modelbox-ai/frontend
          npx tsc --noEmit

      - name: Run Next.js Production Standalone Build
        run: |
          cd modelbox-ai/frontend
          npm run build

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04
    # Blocking as of v1.6.0. The ESLint config was added in Sprint 1 and the
    # codebase was already clean apart from one unescaped apostrophe, so the
    # planned `continue-on-error` grace period through Sprint 5 bought nothing.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: modelbox-ai/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd modelbox-ai/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd modelbox-ai/frontend
          npx next lint --max-warnings 0

      # Added to this job rather than as a seventh job, deliberately. "Frontend
      # Lint" is already in branch protection's required set, so the frontend
      # tests gate merges from the moment they land. A new job would need the
      # protection rule updated separately, and until that happened the suite
      # would run without blocking anything — a gate that cannot fail a merge is
      # the "skipped gate must be loud" problem wearing a green tick.
      - name: Run Frontend Tests
        run: |
          cd modelbox-ai/frontend
          npm test

  migrations:
    name: Alembic Single Head
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history and tags: the populated-database verification builds a
          # git worktree at the previous release tag, so the "before" side is
          # produced by the code that shipped rather than the current tree.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: modelbox-ai/backend/requirements.lock

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r modelbox-ai/backend/requirements.lock

      - name: Assert exactly one migration head
        # A second head means two migrations claim the same parent and
        # `alembic upgrade head` fails at container start, not in review.
        run: |
          cd modelbox-ai/backend
          heads="$(alembic heads --resolve-dependencies)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 alembic head, found $count"
            exit 1
          fi

      - name: Assert every revision id fits alembic_version
        # alembic_version.version_num is VARCHAR(32). A longer id raises
        # StringDataRightTruncation *after* the DDL succeeds, while stamping the
        # version — so `alembic heads` above reports clean and an empty-database
        # test passes. Sprint 2 shipped a 40-character id and only a real
        # Postgres upgrade caught it.
        run: |
          cd modelbox-ai/backend
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("alembic/versions").glob("*.py"):
              match = re.search(r'^revision:\s*str\s*=\s*"([^"]+)"',
                                path.read_text(encoding="utf-8"), re.M)
              if match and len(match.group(1)) > 32:
                  bad.append((len(match.group(1)), match.group(1)))
          for length, rev in bad:
              print(f"::error::revision id is {length} chars (max 32): {rev}")
          sys.exit(1 if bad else 0)
          PY

      - name: Verify migrations against a populated database
        # The empirical case for this job: see the revision-id check above.
        # Local checks cannot substitute for a real upgrade against the engine.
        env:
          MODELBOX_MIGRATION_STRICT: "1"
        run: |
          cd modelbox-ai/backend
          # Full history is needed: the "before" side is a worktree at the last tag.
          # test_ledger_roles_postgres.py proves the append-only ledgers and the
          # least-privilege role by raw SQL against a real Postgres (Step 3.2).
          # test_migration_0015_to_head_populated.py: 0015 → head on a populated
          # database, and ORM-vs-migration drift on Postgres (Step 3.3).
          # test_migration_0015_egress_audit.py: 0014 → 0015 populated. Both seed
          # models with a release tag's own code, so they need this job's tags;
          # elsewhere, with no tags and no strict flag, they skip.
          pytest tests/test_migration_0013_populated.py tests/test_ledger_roles_postgres.py tests/test_migration_0015_to_head_populated.py tests/test_migration_0015_egress_audit.py -v --no-header

  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff at the locked version
        # Only Ruff, at the version requirements.lock pins: its default rule
        # set is part of what that version means, so CI and a developer's
        # `ruff check .` enforce the same rules. An empty grep fails the step.
        run: |
          python -m pip install --upgrade pip
          ruff_pin="$(grep -E '^ruff==' modelbox-ai/backend/requirements.lock)"
          pip install "$ruff_pin"

      - name: Run Ruff
        run: |
          cd modelbox-ai/backend
          ruff check .
          ruff check ../tests/blackbox

  backend-typecheck:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            modelbox-ai/backend/requirements.lock
            modelbox-ai/backend/requirements-lint.txt

      - name: Install Backend Dependencies and Type Stubs
        # The application's locked dependencies, so mypy checks against the
        # libraries that ship, plus the stub packages in requirements-lint.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r modelbox-ai/backend/requirements.lock -r modelbox-ai/backend/requirements-lint.txt

      - name: Run mypy
        run: |
          cd modelbox-ai/backend
          mypy app

  leak-guard:
    name: Leak Guard
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Refuse private-repository paths
        # Sprint prompts and plans, research, marketing plans, assessments and
        # market studies belong in the private repository; the patterns are in
        # the script.
        run: python modelbox-ai/scripts/check_leak_guard.py

  blackbox:
    name: Black-box Acceptance
    # The appliance proven from outside (Sprint 7 Step 6, Amendments 1 and 3).
    # tests/blackbox imports nothing from the application; it drives the
    # compose stack over HTTP, `docker compose exec` and psql. Each
    # configuration runs even if an earlier one failed, and each ends with
    # `down -v`, so every configuration starts from empty volumes.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: modelbox-ai
    env:
      COMPOSE: docker compose --env-file .env -f docker/docker-compose.appliance.yml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the suite's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/blackbox/requirements.txt

      - name: "A: only .env.example, compose refuses"
        run: python -m pytest tests/blackbox -m config_a -v --no-header -rA

      - name: Create .env with init-env
        run: sh scripts/init-env.sh

      - name: Build the appliance images
        run: $COMPOSE build

      - name: "B: the hardened appliance, every check passes"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: hardened
        run: |
          $COMPOSE up -d
          python -m pytest tests/blackbox -m config_b -v --no-header -rA

      - name: Stop B
        if: ${{ !cancelled() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

      - name: "Upgrade: designate-appliance-owner on an upgraded database"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: hardened
        run: python -m pytest tests/blackbox -m upgrade -v --no-header -rA

      - name: Stop the upgraded appliance
        if: ${{ !cancelled() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

      - name: "Insecure profile: each check covering a reintroduced weakness fails"
        # Strict expected failures (conftest): a weakened check that passes, or
        # that fails other than on its own check, turns this step red.
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: insecure
        run: |
          $COMPOSE -f tests/blackbox/compose/insecure.yml --profile airgap up -d
          python -m pytest tests/blackbox -m config_b -v --no-header -rA

      - name: Stop the insecure profile
        if: ${{ !cancelled() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

      - name: "C: AIRGAPPED, sentinel keys, egress-deny network"
        if: ${{ !cancelled() }}
        env:
          BLACKBOX_PROFILE: egress-deny
        run: |
          sed -i 's/^AIRGAPPED=.*/AIRGAPPED=true/' .env
          for key in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY MISTRAL_API_KEY DEEPSEEK_API_KEY MOONSHOT_API_KEY; do
            sed -i "s/^${key}=.*/${key}=sentinel-${key}-must-never-leave/" .env
          done
          $COMPOSE -f tests/blackbox/compose/egress-deny.yml up -d
          python -m pytest tests/blackbox -m config_c -v --no-header -rA

      - name: Appliance logs
        if: ${{ failure() }}
        run: |
          docker version --format 'engine {{.Server.Version}}'
          docker compose version
          docker compose -p modelbox-ai ps -a
          docker compose -p modelbox-ai logs --no-color --tail 200

      - name: Stop C
        if: ${{ always() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

  journey:
    name: Engagement Journey
    # One consultant engagement in a real browser (Sprint 8 Step 7): e2e/
    # drives the UI of the appliance in configuration B, with the owner made
    # by create-owner as an operator would. Screenshots and the trace are kept
    # when it fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: modelbox-ai
    env:
      COMPOSE: docker compose --env-file .env -f docker/docker-compose.appliance.yml
      E2E_EMAIL: owner@journey.test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: modelbox-ai/e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: modelbox-ai/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create .env with init-env
        run: sh scripts/init-env.sh

      - name: Build the appliance images
        run: $COMPOSE build

      - name: "B: start the appliance and wait for health"
        run: |
          $COMPOSE up -d
          port=$(sed -n 's/^UI_PORT=//p' .env)
          echo "E2E_BASE_URL=http://localhost:${port:-3000}" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            if curl -fsS "http://localhost:${port:-3000}/api/health" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the appliance never answered /api/health" >&2
          exit 1

      - name: Make the owner with create-owner
        run: |
          password="journey-$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          printf '%s\n' "$password" | $COMPOSE exec -T modelbox-backend python -m app.cli create-owner \
            --email "$E2E_EMAIL" --workspace-name "Journey" --password-stdin

      - name: Run the journey
        working-directory: modelbox-ai/e2e
        run: npx playwright test

      - name: Keep screenshots and the trace
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: engagement-journey
          path: |
            modelbox-ai/e2e/test-results/
            modelbox-ai/e2e/playwright-report/
          retention-days: 14

      - name: Appliance logs
        if: ${{ failure() }}
        run: |
          docker compose -p modelbox-ai ps -a
          docker compose -p modelbox-ai logs --no-color --tail 200

      - name: Stop the appliance
        if: ${{ always() }}
        run: docker compose -p modelbox-ai down -v --remove-orphans

  versions:
    name: Version Consistency
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Assert every version stamp agrees
        # These disagreed four ways before v1.6.0 — package.json 1.2.0,
        # /health 1.2.0, compose tags v1.3.0, release notes v1.5.0.
        run: python modelbox-ai/scripts/check_versions.py
