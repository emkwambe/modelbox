name: Release Images

# Publish versioned backend + frontend images to GHCR on semver tags (v*),
# only after the gate below: the tagged commit is on main and CI passed on it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and origin/main: reachability is decided by git.
          fetch-depth: 0

      - name: Refuse unless the commit is on main and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 modelbox-ai/scripts/check_release_gate.py --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

  publish:
    # The build itself is images.yml, shared with release-dry-run.yml so the
    # dry run exercises the same actions and pins. Only this call pushes.
    name: Build & push images
    needs: gate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: true
