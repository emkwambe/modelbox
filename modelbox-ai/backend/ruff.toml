# Ruff's default rule set for the version pinned in requirements.lock, plus
# two facts about this project it cannot infer. CI runs `ruff check .` here.

[lint.isort]
# `alembic/` in this directory holds the migrations; `import alembic` is the
# installed package, not first-party code.
known-third-party = ["alembic"]

[lint.per-file-ignores]
# A migration that has run is never edited (CLAUDE.md, Migrations), and import
# order is the one rule whose fix is an edit with no effect. Migrations written
# before this file sort `alembic` both ways; every other rule still applies.
"alembic/versions/*" = ["I001"]

[lint.flake8-bugbear]
# FastAPI parameter declarations in defaults are evaluated once by design.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
