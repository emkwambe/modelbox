[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    preview: a Preview-dialect failure (Blueprint Q4). Not scheduled for repair,
        so it is excluded from the Sprint 3 xfail burn-down. Report separately
        with: -m preview  /  exclude with: -m "not preview"
    slow: needs Docker or a live database; excluded from the fast subset
