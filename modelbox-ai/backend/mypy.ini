# CI runs `mypy app` here, with requirements.lock and requirements-lint.txt.
[mypy]
python_version = 3.11
warn_unused_ignores = True

# These ship no type information and have no stub package. Named one by one,
# so a new untyped dependency is an error until someone decides about it.
[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-aiomysql.*]
ignore_missing_imports = True
