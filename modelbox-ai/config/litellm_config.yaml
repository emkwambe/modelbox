# =============================================================================
# LiteLLM proxy configuration (consumed by the litellm-proxy container).
#
# This is the LiteLLM proxy's own `model_list` schema — distinct from
# `model_router.yaml`, which is ModelBox AI's task→provider routing config read
# by the backend's LLMGateway. Keeping them separate lets the proxy start
# cleanly while the app owns its higher-level routing policy.
#
# API keys resolve from the environment at request time, so the proxy boots
# even when keys are unset (e.g. in a smoke test / air-gapped bring-up).
# =============================================================================
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: mistral-large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  telemetry: false
