# =============================================================================
# TEST ONLY. Configuration C of the black-box suite (Sprint 7, Step 6).
#
# Layered on docker/docker-compose.appliance.yml with AIRGAPPED=true and
# sentinel provider keys in .env. Every service except the UI sits on an
# internal-only network, which Docker gives no gateway, so nothing on it can
# reach outside. The UI is also on a normal network so its published port
# answers the host; the backend is reachable only through it.
# =============================================================================

networks:
  egress-deny:
    internal: true
  host-facing: {}

services:
  modelbox-ui:
    # On Docker Engine 28.0.4 the UI's published port accepted and then reset
    # every host connection while the UI was also on the internal network, with
    # or without gw_priority. Configuration C therefore sends its HTTP from
    # inside the UI container to the UI's own port (conftest.ExecTransport);
    # the host-port checks are configuration B's (B3).
    networks: [egress-deny, host-facing]
  modelbox-backend:
    networks: [egress-deny]
  modelbox-worker:
    networks: [egress-deny]
  modelbox-migrate:
    networks: [egress-deny]
  postgres-db:
    networks: [egress-deny]
  redis-cache:
    networks: [egress-deny]
