# =============================================================================
# TEST ONLY. Configuration C of the black-box suite (Sprint 7, Step 6).
#
# Layered on docker/docker-compose.appliance.yml with AIRGAPPED=true and
# sentinel provider keys in .env. Every service except the UI sits on an
# internal-only network, which Docker gives no gateway, so nothing on it can
# reach outside. The UI is also on a normal network so its published port
# answers the host; the backend is reachable only through it.
# =============================================================================

networks:
  egress-deny:
    internal: true
  host-facing: {}

services:
  modelbox-ui:
    networks:
      # The host-facing network is the UI's gateway network, so its published
      # port maps to the UI's address there. Without the priority the mapping
      # took its address on the internal network, which the host cannot reach.
      host-facing:
        gw_priority: 1
      egress-deny: {}
  modelbox-backend:
    networks: [egress-deny]
  modelbox-worker:
    networks: [egress-deny]
  modelbox-migrate:
    networks: [egress-deny]
  postgres-db:
    networks: [egress-deny]
  redis-cache:
    networks: [egress-deny]
